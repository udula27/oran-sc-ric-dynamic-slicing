# srsRAN Project gNB Configuration with ZMQ RF and E2 Agent
# Compatible with Open5GS 5GC and ORAN-SC RIC

cu_cp:
  amf:
    addr: 10.53.1.2                # Open5GS AMF address
    port: 38412
    bind_addr: 10.53.1.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq               # ZMQ RF simulation
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 60
  rx_gain: 60

cell_cfg:
  dl_arfcn: 368500                  # Band 3 (1800 MHz) 
  band: 3
  channel_bandwidth_MHz: 10         # 10 MHz bandwidth
  common_scs: 15                    # 15 kHz subcarrier spacing
  plmn: "00101"
  tac: 7
  pci: 1

e2:
  enable_du_e2: true               # Enable E2 agent
  addr: 127.0.0.1                 # RIC E2 termination address (localhost)
  port: 36421                      # E2AP SCTP port

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap

cu_cp:
  amf:
    addr: 10.53.1.2          # AMF NGAP IP (from your 5gc compose)
    port: 38412
    bind_addr: 10.53.1.3     # gNB IP (from your gNB container on 'ran' network)
  supported_tracking_areas:
    - tac: 7
      plmn_list:
        - plmn: "00101"
          tai_slice_support_list:
            - sst: 1         # eMBB
            - sst: 2         # mMTC
            - sst: 3         # URLLC
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1

  # -------- RAN slice PRB policy (supported by srsRAN) ----------
  slicing:
    - sst: 1
      sched_cfg:
        min_prb_policy_ratio: 30   # guarantee >=30% PRBs for eMBB
        max_prb_policy_ratio: 60   # cap <=60%
    - sst: 2
      sched_cfg:
        min_prb_policy_ratio: 5    # small guaranteed share for mMTC
        max_prb_policy_ratio: 25
    - sst: 3
      sched_cfg:
        min_prb_policy_ratio: 20   # guaranteed share for URLLC
        max_prb_policy_ratio: 50   # allow up to half if needed

  # PHY/MAC settings compatible with srsUE / typical lab setup
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

# -------- E2 Agent (Near-RT RIC) ----------
# If RIC runs on the SAME HOST and e2term is published as "36421:36421/sctp" in docker-compose,
# set addr to the HOST IP (not 127.0.0.1 from inside the gNB container).
# Example: addr: 192.168.x.y  (your host’s IP), port: 36421
e2:
  enable_du_e2: true
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  addr: 192.168.0.10          # <<< CHANGE THIS to your HOST IP where RIC published 36421
  bind_addr: 10.53.1.3        # source IP of the gNB (container) for SCTP towards RIC
  port: 36421

log:
  filename: /tmp/gnb.log
  all_level: info
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
  e2ap_enable: true
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_json: true
  periodicity:
    du_report_period: 1000
    cu_up_report_period: 1000
    cu_cp_report_period: 1000
  layers:
    enable_ru: false
    enable_sched: true
    enable_rlc: true
    enable_mac: true
    enable_pdcp: true
    enable_du_low: false